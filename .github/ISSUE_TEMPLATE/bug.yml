name: Report a bug
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste real personal or financial data** (IBANs, amounts, names, emails, tokens): if you need examples, make them up.
        For a vulnerability do not use this form, see [SECURITY.md](https://github.com/YonderUrik/buddy-budget/blob/main/SECURITY.md).
  - type: textarea
    id: cosa
    attributes:
      label: What happens
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error ...
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Where you saw it
      description: Browser and operating system, or whether it is your own local installation (Node and Postgres versions).
  - type: textarea
    id: extra
    attributes:
      label: Other
      description: Screenshots (without real data), error messages, logs.
