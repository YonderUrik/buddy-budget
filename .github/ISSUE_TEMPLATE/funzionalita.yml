name: Suggest a feature
description: An idea to improve BuddyBudget
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: What problem do you want to solve
      description: Describe the situation in which something is missing today, before the solution.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: What you propose
      description: How you imagine it would work. If you have seen the same thing elsewhere, say so.
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contributo
    attributes:
      label: Contribution
      options:
        - label: I would like to work on it myself (we discuss it here before writing code)
