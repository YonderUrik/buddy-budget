version: 2

# Policy: patch updates only. Minor and major are ignored so as not to break the app for no reason; they are done by hand, on purpose.
# `ignore` applies to version updates: Dependabot security updates arrive anyway, even if minor or major.
# The `fix` prefix triggers a release (release-please) when a runtime dependency changes; `chore` for development ones.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      patch:
        update-types: [patch]
  - package-ecosystem: npm
    directory: /landing
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      patch:
        update-types: [patch]
  # GitHub Actions use major-only tags (@v4): every update is a major, so they are ignored and updated by hand.
  # Security updates still apply.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
