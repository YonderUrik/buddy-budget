name: Auto-merge PR automatiche

# Enables auto-merge (squash) on low-risk bot PRs: Dependabot patch updates. GitHub merges them by itself only when all required branch protection checks are green; the release PR
# and Dependabot minor/major updates (including security ones) stay manual. Requires "Allow auto-merge" in the repo settings: if it is off the step
# fails without blocking anything. Never runs PR code (pull_request_target, no checkout).
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Abilita auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Abilita auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
