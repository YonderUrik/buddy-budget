name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Sulle PR un run per ramo (i vecchi si annullano). Su main un gruppo per commit: con un solo gruppo GitHub tiene
  # un solo run in attesa e scarta gli intermedi, e il run di una release poteva non partire mai (versione non distribuita).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Si annullano solo i run delle PR superati da un push nuovo. Quelli su main non vanno mai annullati: un run
  # cancellato salta immagini e rilascio di quel commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Cosa è cambiato
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      landing: ${{ steps.f.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Sulle PR salta i job che non servono (es. un bump di dipendenze solo in landing/ non rilancia lint e test dell'app).
      # I job saltati contano come superati per i check obbligatori. Su main lo stesso confronto è con il commit precedente.
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Su main si confronta con il commit precedente; se non è raggiungibile (force push, primo push) gira tutto.
          if [ "$EVENT" != "pull_request" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "landing=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then files=$(git diff --name-only "$BASE...$HEAD"); else files=$(git diff --name-only "$BASE" "$HEAD"); fi
          echo "$files"
          # App: tutto tranne landing/, docs/ e i file markdown.
          if echo "$files" | grep -qvE '^(landing/|docs/)|\.md$'; then app=true; else app=false; fi
          # Landing: landing/, il catalogo funzioni condiviso (lib/features/) e i workflow stessi.
          if echo "$files" | grep -qE '^(landing/|lib/features/|\.github/)'; then landing=true; else landing=false; fi
          # Se cambiano i workflow, prova entrambi.
          if echo "$files" | grep -qE '^\.github/'; then app=true; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "landing=$landing" >> "$GITHUB_OUTPUT"

  lint-types:
    name: Lint e tipi
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit

  # I test girano contro un Postgres reale e un file alla volta (vitest.config.ts: fileParallelism false), quindi non si
  # parallelizzano nello stesso job: si dividono in 2 job con un database ciascuno (--shard di vitest).
  test:
    name: Test ${{ matrix.shard }}/2
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Valori fittizi usati solo dai test: nessun servizio esterno viene contattato con queste credenziali.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buddy_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-000000000000
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-id
      GOOGLE_CLIENT_SECRET: ci-google-secret
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM: ci@example.com
      GOCARDLESS_SECRET_ID: ci-gocardless-id
      GOCARDLESS_SECRET_KEY: ci-gocardless-key
      CRON_SECRET: ci-only-placeholder-cron-secret-0000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test --shard=${{ matrix.shard }}/2

  # Check obbligatoria su main (nome invariato): riassume lint/tipi e i due shard dei test. Se l'app non è cambiata
  # i job a monte sono saltati e questo non gira, quindi conta come superata come prima.
  check:
    name: Lint, tipi e test
    needs: [changes, lint-types, test]
    if: always() && needs.changes.outputs.app == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - env:
          LINT: ${{ needs.lint-types.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint-types=$LINT test=$TEST"
          [ "$LINT" = "success" ] && [ "$TEST" = "success" ]

  release:
    name: Release (release-please)
    timeout-minutes: 10
    # Non aspetta i test: release-please è solo contabilità (PR di release, tag). Il deploy invece aspetta le check (sotto).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # `is_release` è true solo nel run causato dal merge della PR di release: quello che deve distribuire.
      version: ${{ steps.rp.outputs.version }}
      is_release: ${{ steps.rp.outputs.release_created == 'true' }}
    steps:
      # Legge i titoli delle PR (Conventional Commits) dall'ultimo tag e tiene aperta una PR "chore(main): release X.Y.Z"
      # con versione (app e landing) e CHANGELOG. Al merge di quella PR crea tag e GitHub Release.
      # Con RELEASE_PLEASE_TOKEN (PAT) la PR di release riceve anche i check; con GITHUB_TOKEN no (vedi docs/rilasci.md).
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Immagine ${{ matrix.image }}
    timeout-minutes: 30
    needs: [release]
    # Le immagini servono solo al deploy, che usa il tag di versione: si costruiscono nel run del rilascio, non a ogni push.
    # Partono in parallelo ai test; il deploy (sotto) aspetta che le check siano passate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: buddy-budget
            target: runner
          - image: buddy-budget-migrate
            target: migrator
          - image: buddy-budget-csv-worker
            target: csv-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.is_release == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-infra-tag:
    name: Deploy app (tag versione nel repo infra)
    timeout-minutes: 10
    needs: [check, image, release]
    # Check saltata (nessun file dell'app cambiato) va bene; fallita o annullata no.
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    # Se due release arrivano ravvicinate vince l'ultima: quella in attesa si scarta, quella in corso finisce.
    concurrency:
      group: deploy-infra-app
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Registra il deploy nella scheda Deployments del repo.
    environment:
      name: production
      url: https://app.buddybudget.io
    steps:
      - uses: actions/checkout@v4
        with:
          repository: YonderUrik/buddy-budget-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with:
          kustomize-version: "5.4.3"
      - name: Aggiorna il tag immagine
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd argocd/manifests/app
          current=$(grep -m1 -oE 'newTag: *"?[0-9][0-9.]*' kustomization.yaml | grep -oE '[0-9][0-9.]*$' || true)
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Nel repo infra c'è già la versione $current, più recente di $VERSION: non la riporto indietro."
            exit 0
          fi
          kustomize edit set image \
            ghcr.io/yonderurik/buddy-budget=ghcr.io/yonderurik/buddy-budget:${VERSION} \
            ghcr.io/yonderurik/buddy-budget-migrate=ghcr.io/yonderurik/buddy-budget-migrate:${VERSION} \
            ghcr.io/yonderurik/buddy-budget-csv-worker=ghcr.io/yonderurik/buddy-budget-csv-worker:${VERSION}
          # The infra PR stages this Deployment at zero until its first image is published.
          if [ -f csv-worker.yaml ]; then
            kustomize edit set replicas buddy-budget-csv-worker=1
          fi
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/manifests/app/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Nessuna modifica al tag, skip commit."
          else
            git commit -m "chore: rilascia buddy-budget v${VERSION} (${GITHUB_SHA::7})"
            # Può girare in parallelo al job della landing, che scrive sullo stesso repo (file diverso): rebase e riprova.
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi

  landing:
    name: Landing (lint, tipi, test, build)
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: landing/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:features
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  landing-image:
    name: Immagine landing
    timeout-minutes: 20
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/buddy-budget-landing
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.is_release == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: landing
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buddy-budget-landing
          cache-to: type=gha,mode=max,scope=buddy-budget-landing

  update-infra-tag-landing:
    name: Deploy landing (tag versione nel repo infra)
    timeout-minutes: 10
    needs: [landing, landing-image, release]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    concurrency:
      group: deploy-infra-landing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: landing
      url: https://buddybudget.io
    steps:
      - uses: actions/checkout@v4
        with:
          repository: YonderUrik/buddy-budget-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with:
          kustomize-version: "5.4.3"
      - name: Aggiorna il tag immagine
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd argocd/manifests/landing
          current=$(grep -m1 -oE 'newTag: *"?[0-9][0-9.]*' kustomization.yaml | grep -oE '[0-9][0-9.]*$' || true)
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Nel repo infra c'è già la versione $current, più recente di $VERSION: non la riporto indietro."
            exit 0
          fi
          kustomize edit set image \
            ghcr.io/yonderurik/buddy-budget-landing=ghcr.io/yonderurik/buddy-budget-landing:${VERSION}
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/manifests/landing/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Nessuna modifica al tag, skip commit."
          else
            git commit -m "chore: rilascia buddy-budget-landing v${VERSION} (${GITHUB_SHA::7})"
            # Può girare in parallelo al job dell'app, che scrive sullo stesso repo (file diverso): rebase e riprova.
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi
