name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # On PRs one run per branch (older ones are cancelled). On main one group per commit: with a single group GitHub keeps
  # only one pending run and discards the intermediate ones, and a release run might never start (version not deployed).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only PR runs superseded by a new push are cancelled. Those on main must never be cancelled: a cancelled
  # run skips the images and release of that commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Cosa è cambiato
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      landing: ${{ steps.f.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On PRs, skips the jobs that are not needed (e.g. a dependency bump only in landing/ does not rerun the app's lint and tests).
      # Skipped jobs count as passed for required checks. On main the same comparison is against the previous commit.
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # On main, compare with the previous commit; if it is not reachable (force push, first push) everything runs.
          if [ "$EVENT" != "pull_request" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "landing=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then files=$(git diff --name-only "$BASE...$HEAD"); else files=$(git diff --name-only "$BASE" "$HEAD"); fi
          echo "$files"
          # App: everything except landing/, docs/ and markdown files.
          if echo "$files" | grep -qvE '^(landing/|docs/)|\.md$'; then app=true; else app=false; fi
          # Landing: landing/, the shared feature catalog (lib/features/) and the workflows themselves.
          if echo "$files" | grep -qE '^(landing/|lib/features/|\.github/)'; then landing=true; else landing=false; fi
          # If the workflows change, test both.
          if echo "$files" | grep -qE '^\.github/'; then app=true; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "landing=$landing" >> "$GITHUB_OUTPUT"

  lint-types:
    name: Lint e tipi
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit

  # Tests run against a real Postgres and one file at a time (vitest.config.ts: fileParallelism false), so they cannot
  # be parallelised within the same job: they are split into 2 jobs with one database each (vitest --shard).
  test:
    name: Test ${{ matrix.shard }}/2
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Fake values used only by the tests: no external service is contacted with these credentials.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buddy_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-000000000000
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-id
      GOOGLE_CLIENT_SECRET: ci-google-secret
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM: ci@example.com
      GOCARDLESS_SECRET_ID: ci-gocardless-id
      GOCARDLESS_SECRET_KEY: ci-gocardless-key
      CRON_SECRET: ci-only-placeholder-cron-secret-0000000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test --shard=${{ matrix.shard }}/2

  # Required check on main (name unchanged): summarises lint/types and the two test shards. If the app has not changed
  # the upstream jobs are skipped and this does not run, so it counts as passed as before.
  check:
    name: Lint, tipi e test
    needs: [changes, lint-types, test]
    if: always() && needs.changes.outputs.app == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - env:
          LINT: ${{ needs.lint-types.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint-types=$LINT test=$TEST"
          [ "$LINT" = "success" ] && [ "$TEST" = "success" ]

  release:
    name: Release (release-please)
    timeout-minutes: 10
    # Does not wait for tests: release-please is only bookkeeping (release PR, tags). The deploy instead waits for the checks (below).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # `is_release` is true only in the run triggered by merging the release PR: the one that must deploy.
      version: ${{ steps.rp.outputs.version }}
      is_release: ${{ steps.rp.outputs.release_created == 'true' }}
    steps:
      # Reads PR titles (Conventional Commits) since the last tag and keeps a "chore(main): release X.Y.Z" PR open
      # with the version (app and landing) and CHANGELOG. When that PR is merged it creates the tag and GitHub Release.
      # With RELEASE_PLEASE_TOKEN (PAT) the release PR also gets the checks; with GITHUB_TOKEN it does not (see docs/rilasci.md).
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Immagine ${{ matrix.image }}
    # Every release also moves `latest`, the default of docker-compose.yml for self-hosters.
    # With SELFHOST_IMAGES=true (repo variable, see docs/self-hosting.md) the image is multi-architecture and slower to build.
    timeout-minutes: 60
    needs: [release]
    # Images are needed only for the deploy, which uses the version tag: they are built in the release run, not on every push.
    # They start in parallel with the tests; the deploy (below) waits for the checks to pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: buddy-budget
            target: runner
          - image: buddy-budget-migrate
            target: migrator
          - image: buddy-budget-csv-worker
            target: csv-worker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: vars.SELFHOST_IMAGES == 'true'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.is_release == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ vars.SELFHOST_IMAGES == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          sbom: ${{ vars.SELFHOST_IMAGES == 'true' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-infra-tag:
    name: Deploy app (tag versione nel repo infra)
    timeout-minutes: 10
    needs: [check, image, release]
    # A skipped check (no app file changed) is fine; failed or cancelled is not.
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    # If two releases arrive close together the latest wins: the pending one is discarded, the running one finishes.
    concurrency:
      group: deploy-infra-app
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Records the deploy in the repo's Deployments tab.
    environment:
      name: production
      url: https://app.buddybudget.io
    steps:
      - uses: actions/checkout@v7
        with:
          repository: YonderUrik/buddy-budget-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: "5.4.3"
      - name: Aggiorna il tag immagine
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd argocd/manifests/app
          current=$(grep -m1 -oE 'newTag: *"?[0-9][0-9.]*' kustomization.yaml | grep -oE '[0-9][0-9.]*$' || true)
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Nel repo infra c'è già la versione $current, più recente di $VERSION: non la riporto indietro."
            exit 0
          fi
          kustomize edit set image \
            ghcr.io/yonderurik/buddy-budget=ghcr.io/yonderurik/buddy-budget:${VERSION} \
            ghcr.io/yonderurik/buddy-budget-migrate=ghcr.io/yonderurik/buddy-budget-migrate:${VERSION} \
            ghcr.io/yonderurik/buddy-budget-csv-worker=ghcr.io/yonderurik/buddy-budget-csv-worker:${VERSION}
          # The infra PR stages this Deployment at zero until its first image is published.
          if [ -f csv-worker.yaml ]; then
            kustomize edit set replicas buddy-budget-csv-worker=1
          fi
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/manifests/app/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Nessuna modifica al tag, skip commit."
          else
            git commit -m "chore: rilascia buddy-budget v${VERSION} (${GITHUB_SHA::7})"
            # May run in parallel with the landing job, which writes to the same repo (different file): rebase and retry.
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi

  landing:
    name: Landing (lint, tipi, test, build)
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: landing/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:features
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  landing-image:
    name: Immagine landing
    timeout-minutes: 20
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `page-dates.mjs` dates each page by its last commit, for the sitemap's lastmod.
          fetch-depth: 0
      - name: Date delle pagine
        run: node landing/scripts/page-dates.mjs
      # The screenshots are not on main (see docs/landing-screens.md): the image needs them in the build context.
      - name: Scarica gli screenshot
        run: node landing/scripts/pull-screens.mjs
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/buddy-budget-landing
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.is_release == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: landing
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buddy-budget-landing
          cache-to: type=gha,mode=max,scope=buddy-budget-landing

  update-infra-tag-landing:
    name: Deploy landing (tag versione nel repo infra)
    timeout-minutes: 10
    needs: [landing, landing-image, release]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.is_release == 'true'
    concurrency:
      group: deploy-infra-landing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: landing
      url: https://buddybudget.io
    steps:
      - uses: actions/checkout@v7
        with:
          repository: YonderUrik/buddy-budget-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: "5.4.3"
      - name: Aggiorna il tag immagine
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd argocd/manifests/landing
          current=$(grep -m1 -oE 'newTag: *"?[0-9][0-9.]*' kustomization.yaml | grep -oE '[0-9][0-9.]*$' || true)
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Nel repo infra c'è già la versione $current, più recente di $VERSION: non la riporto indietro."
            exit 0
          fi
          kustomize edit set image \
            ghcr.io/yonderurik/buddy-budget-landing=ghcr.io/yonderurik/buddy-budget-landing:${VERSION}
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/manifests/landing/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Nessuna modifica al tag, skip commit."
          else
            git commit -m "chore: rilascia buddy-budget-landing v${VERSION} (${GITHUB_SHA::7})"
            # May run in parallel with the app job, which writes to the same repo (different file): rebase and retry.
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi
