name: Screenshot landing

# Regenerates the app screenshots for the landing in every interface language (see docs/landing-screens.md) and opens a
# PR with the new images.
# Does not run on every merge: with many PRs close together it was redone each time (~3 minutes, plus CI for the bot's PR).
# Runs once a day, when the screen definition changes (list, scripts, demo data), and manually.
# Whoever visibly changes a screen still regenerates the screenshots in their own PR (CLAUDE.md).
# With RELEASE_PLEASE_TOKEN (PAT) the PR triggers CI and "Titolo PR" by itself; with GITHUB_TOKEN alone it does not, and a
# manual "Re-run" is needed (see docs/rilasci.md).
on:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/demo-seed.ts"
      - "scripts/demo-seed-texts.ts"
      - "landing/content/screens.ts"
      - "landing/scripts/capture-screens.mjs"
  workflow_dispatch:

concurrency:
  group: landing-screens
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    name: Cattura screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bb_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Fake values: no external service is contacted. `sslmode=disable` because in production the app requires TLS,
    # which the job's Postgres does not have.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bb_demo?sslmode=disable
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-000000000000
      BETTER_AUTH_URL: http://localhost:3300
      APP_URL: http://localhost:3300
      GOOGLE_CLIENT_ID: demo
      GOOGLE_CLIENT_SECRET: demo
      RESEND_API_KEY: re_demo
      RESEND_FROM: demo@example.com
      GOCARDLESS_SECRET_ID: demo
      GOCARDLESS_SECRET_KEY: demo
      CRON_SECRET: ci-only-placeholder-cron-secret-0000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm demo:seed
      - run: pnpm build
      - run: pnpm exec next start -p 3300 &
      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      # Italian first: the other languages reuse its sizes. Each language re-seeds the demo user with its own texts
      # (German also with the German product rules) while the app keeps running.
      - name: Attendi l'app e cattura in ogni lingua
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          npx --yes wait-on http://localhost:3300/login --timeout 60000
          for language in it en de; do
            DEMO_LANGUAGE=$language pnpm demo:seed
            (cd landing && CAPTURE_LANGUAGE=$language node --experimental-strip-types scripts/capture-screens.mjs)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: landing-screens
          path: landing/public/screens
      - name: Apri o aggiorna la PR con le immagini nuove
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: bot/landing-screens
          add-paths: landing/public/screens
          commit-message: "chore(landing): aggiorna gli screenshot dall'app"
          title: "chore(landing): aggiorna gli screenshot dall'app"
          body: |
            Screenshot rigenerati automaticamente dall'app su `main` con i dati demo (`pnpm demo:seed`).
            Controlla a colpo d'occhio le immagini nel diff prima di fare il merge.

            Nessun nuovo segnale di osservabilità: solo immagini statiche.
