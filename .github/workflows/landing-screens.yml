name: Screenshot landing

# Regenerates the app screenshots for the landing in every interface language (see docs/landing-screens.md) and
# publishes them on the `screenshots` branch as a single commit that replaces the previous one: the repository keeps one
# copy of the images, never their history (each run used to add ~30 MB to `main`). The landing gets them with
# `pnpm screens:pull`; the new images go live with the next landing build (next release).
# Runs once a day, when the screen definition changes (list, scripts, demo data) on `main`, and manually.
# A run that changes no image publishes nothing.
on:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/demo-seed.ts"
      - "lib/public-demo/**"
      - "landing/content/screens.ts"
      - "landing/scripts/capture-screens.mjs"
  workflow_dispatch:

concurrency:
  group: landing-screens
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    name: Cattura screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bb_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Fake values: no external service is contacted, except Logo.dev for the merchant and fund logos when the
    # `LOGODEV_PUBLISHABLE_KEY` repo secret is set (without it the screens show initials, as before).
    # `sslmode=disable` because in production the app requires TLS, which the job's Postgres does not have.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bb_demo?sslmode=disable
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-000000000000
      BETTER_AUTH_URL: http://localhost:3300
      APP_URL: http://localhost:3300
      GOOGLE_CLIENT_ID: demo
      GOOGLE_CLIENT_SECRET: demo
      RESEND_API_KEY: re_demo
      RESEND_FROM: demo@example.com
      GOCARDLESS_SECRET_ID: demo
      GOCARDLESS_SECRET_KEY: demo
      CRON_SECRET: ci-only-placeholder-cron-secret-0000000
      LOGODEV_PUBLISHABLE_KEY: ${{ secrets.LOGODEV_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm demo:seed
      - run: pnpm build
      - run: pnpm exec next start -p 3300 &
      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      # The current images: unchanged captures keep the same file, and the manifests keep their `capturedAt`.
      - name: Scarica gli screenshot attuali
        run: cd landing && node scripts/pull-screens.mjs
      # Italian first: the other languages reuse its sizes. Each language re-seeds the demo user with its own texts
      # (German also with the German product rules) while the app keeps running.
      - name: Attendi l'app e cattura in ogni lingua
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          npx --yes wait-on http://localhost:3300/login --timeout 60000
          for language in it en de; do
            DEMO_LANGUAGE=$language pnpm demo:seed
            (cd landing && CAPTURE_LANGUAGE=$language node --experimental-strip-types scripts/capture-screens.mjs)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: landing-screens
          path: landing/public/screens
      # One orphan commit, force-pushed: the old images become unreachable and leave the repository.
      - name: Pubblica gli screenshot sul ramo screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        working-directory: landing/public/screens
        run: |
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git add -A
          if git fetch -q --depth=1 "$remote" screenshots && [ "$(git write-tree)" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "No screenshot changed: nothing to publish."
            exit 0
          fi
          git commit -q -m "chore: landing screenshots from ${GITHUB_SHA::7}"
          git push -q --force "$remote" HEAD:refs/heads/screenshots
