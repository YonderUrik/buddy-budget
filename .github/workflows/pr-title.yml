name: Titolo PR

# The PR title becomes the squash commit message and, from there, the version (release-please):
# feat → minor, fix/perf → patch, "!" or BREAKING CHANGE → minor while on 0.x. See docs/rilasci.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titolo:
    name: Titolo in formato Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            test
            build
            revert
          # The title may start with an uppercase letter or a proper noun: no constraint on the subject.
          subjectPattern: ^.+$
