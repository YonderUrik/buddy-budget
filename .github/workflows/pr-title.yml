name: Titolo PR

# Il titolo della PR diventa il messaggio del commit di squash e da lì la versione (release-please):
# feat → minor, fix/perf → patch, "!" o BREAKING CHANGE → minor finché si è in 0.x. Vedi docs/rilasci.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titolo:
    name: Titolo in formato Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            test
            build
            revert
          # Il titolo è in italiano e può iniziare con maiuscola o nome proprio: nessun vincolo sul soggetto.
          subjectPattern: ^.+$
