name: buddybudget-staging

x-service: &service
  restart: unless-stopped
  dns: [1.1.1.1, 9.9.9.9]
  logging:
    driver: local
    options: {max-size: 10m, max-file: '3'}
  security_opt: [no-new-privileges:true]

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://buddybudget:${POSTGRES_PASSWORD:?}@postgres:5432/buddybudget?sslmode=disable
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  BETTER_AUTH_URL: ${APP_URL:?}
  APP_URL: ${APP_URL:?}
  CRON_SECRET: ${CRON_SECRET:?}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
  PERSONAL_CSV_ENCRYPTION_KEY: ${PERSONAL_CSV_ENCRYPTION_KEY:?}
  SELF_HOSTED: 'false'
  AUTH_PASSWORD: 'false'
  ALLOW_SIGNUPS: 'true'
  # Match hosted production: login codes, links and notification emails use Resend.
  SMTP_URL: ''
  EMAIL_FROM: ''
  RESEND_API_KEY: ${RESEND_API_KEY:?Configure the staging Resend API key}
  RESEND_FROM: ${RESEND_FROM:?Configure the verified Resend sender}
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  GOCARDLESS_SECRET_ID: ''
  GOCARDLESS_SECRET_KEY: ''
  BANK_CONNECTIONS_OPEN: 'false'
  GOCARDLESS_CLEANUP_MODE: 'off'
  INACTIVITY_CLEANUP_MODE: 'dry-run'
  NOTIFICATIONS_MODE: execute
  PUBLIC_DEMO_ENABLED: 'true'
  SUPPORT_EMAIL_TO: ''
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Configure the staging categorization API key}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
  LOG_LEVEL: info

services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    mem_limit: 768m
    cpus: 1
    environment:
      POSTGRES_USER: buddybudget
      POSTGRES_DB: buddybudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U buddybudget -d buddybudget]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    <<: *service
    image: redis:7-alpine
    mem_limit: 192m
    cpus: 0.25
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *service
    image: ghcr.io/yonderurik/buddy-budget-migrate:${BUDDYBUDGET_VERSION:?}
    restart: 'no'
    mem_limit: 768m
    cpus: 1
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  app:
    <<: *service
    image: ghcr.io/yonderurik/buddy-budget:${BUDDYBUDGET_VERSION:?}
    mem_limit: 1536m
    cpus: 2
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  csv-worker:
    <<: *service
    image: ghcr.io/yonderurik/buddy-budget-csv-worker:${BUDDYBUDGET_VERSION:?}
    mem_limit: 1536m
    cpus: 1
    environment:
      <<: *app-env
      # Production has distinct OpenRouter credentials for the app and CSV worker.
      OPENROUTER_API_KEY: ${CSV_WORKER_OPENROUTER_API_KEY:?Configure the staging CSV worker API key}
    depends_on:
      migrate: {condition: service_completed_successfully}

  cron:
    <<: *service
    image: alpine:3.21
    mem_limit: 64m
    cpus: 0.1
    environment:
      CRON_SECRET: ${CRON_SECRET:?}
    volumes: [./scheduler.sh:/scheduler.sh:ro]
    command: [sh, /scheduler.sh]
    depends_on:
      app: {condition: service_healthy}

  gateway:
    <<: *service
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    mem_limit: 96m
    cpus: 0.25
    ports: ['127.0.0.1:3080:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAGING_ROOT:?}/secrets/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, nginx, -t, -q]
      interval: 15s
      timeout: 5s
      retries: 5

  tunnel:
    <<: *service
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: [public]
    user: '1000:1000'
    mem_limit: 192m
    cpus: 0.5
    command: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', --config, /etc/cloudflared/config.yml, run]
    volumes:
      - ${STAGING_ROOT:?}/secrets/cloudflare:/etc/cloudflared:ro
    depends_on: [gateway]
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, '127.0.0.1:2000', ready]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  postgres-data:
