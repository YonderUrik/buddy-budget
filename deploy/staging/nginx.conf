map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # Published only on the host's Tailscale address (compose.yml): not reachable from the internet or the LAN.
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    auth_basic "BuddyBudget staging";
    auth_basic_user_file /etc/nginx/htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Resolve containers again after rollouts, without restarting this gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:3000;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The edge password is separate from application authentication.
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
