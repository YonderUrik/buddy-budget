# Overrides the images with a local build from source (slower, useful to try changes or on arm64 without published images):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  migrate:
    build: { context: ., target: migrator }
    image: buddy-budget-migrate:local
  app:
    build: { context: ., target: runner }
    image: buddy-budget:local
  csv-worker:
    build: { context: ., target: csv-worker }
    image: buddy-budget-csv-worker:local
