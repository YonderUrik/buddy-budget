# BuddyBudget self-hosted: app + Postgres + Redis + scheduler for periodic jobs (+ the AI import worker, optional).
# Full guide: docs/self-hosting.md. Quick start: ./scripts/selfhost-init.sh && docker compose up -d
# Then open APP_URL and create the first account (email and password, no email server needed).
#
# Images come from ghcr.io (BUDDYBUDGET_VERSION, default latest). To build them from source:
#   docker compose -f docker-compose.yml -f deploy/selfhost/compose.build.yml up -d --build

name: buddybudget

x-app-env: &app-env
  NODE_ENV: production
  SELFHOST_AUTH_MODE: ${SELFHOST_AUTH_MODE:-server}
  SELFHOST_OWNER_EMAIL: ${SELFHOST_OWNER_EMAIL:-}
  APP_BIND: ${APP_BIND:-127.0.0.1}
  # sslmode=disable: the compose Postgres is on the internal network and has no certificates. An external Postgres
  # must instead be reached with sslmode=require (see docs/self-hosting.md).
  DATABASE_URL: postgresql://buddybudget:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing, run ./scripts/selfhost-init.sh}@postgres:5432/buddybudget?sslmode=disable
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is missing, run ./scripts/selfhost-init.sh}
  BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
  APP_URL: ${APP_URL:-http://localhost:3000}
  CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is missing, run ./scripts/selfhost-init.sh}
  # Self-hosted install: sign-in with email and password, only the first account can sign up (ALLOW_SIGNUPS opens it),
  # no hosted-service Terms to accept, no product analytics.
  SELF_HOSTED: "true"
  AUTH_PASSWORD: ${AUTH_PASSWORD:-}
  ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-}
  # Optional integrations: empty = off (see deploy/selfhost/env.example).
  SMTP_URL: ${SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  # The summary and alert emails really go out (each user turns them on in Impostazioni → Notifiche).
  NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-execute}
  SUPPORT_EMAIL_TO: ${SUPPORT_EMAIL_TO:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
  GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
  BANK_CONNECTIONS_OPEN: ${BANK_CONNECTIONS_OPEN:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
  PERSONAL_CSV_ENCRYPTION_KEY: ${PERSONAL_CSV_ENCRYPTION_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Optional: encrypts descriptions and notes in the database (see docs/self-hosting.md, «Backup e ripristino»).
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  CATEGORIZATION_MODEL: ${CATEGORIZATION_MODEL:-typesafe/jev-1.13}
  LOGODEV_PUBLISHABLE_KEY: ${LOGODEV_PUBLISHABLE_KEY:-}
  LOGODEV_SECRET_KEY: ${LOGODEV_SECRET_KEY:-}
  ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
  TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
  STOOQ_API_KEY: ${STOOQ_API_KEY:-}
  COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
  OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buddybudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing, run ./scripts/selfhost-init.sh}
      POSTGRES_DB: buddybudget
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddybudget -d buddybudget"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only cache, rate limiting and background job state: it can be lost without harm, no volume.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Applies the migrations and exits. Runs on every `up`, so an update moves them forward by itself.
  migrate:
    image: ghcr.io/yonderurik/buddy-budget-migrate:${BUDDYBUDGET_VERSION:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://buddybudget:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing, run ./scripts/selfhost-init.sh}@postgres:5432/buddybudget?sslmode=disable
      # Needed only by `pnpm db:encrypt-fields` (encryption of already stored data); migrations do not use it.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ghcr.io/yonderurik/buddy-budget:${BUDDYBUDGET_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    # By default only from this machine: to put it online use an HTTPS reverse proxy (docs/self-hosting.md).
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Calls the /api/cron/* endpoints at the same times (UTC) as the production cluster: market prices,
  # net worth snapshots, account deletion, summary emails, bank sync. Without this, prices and history are not updated.
  # Not here on purpose: `inactive-accounts` (the hosted service deletes accounts unused for 90 days; your own install
  # keeps them) and `public-demo`.
  cron:
    image: alpine:3.21
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is missing, run ./scripts/selfhost-init.sh}
      GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
      NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-execute}
      GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
      EMAIL_CONFIGURED: ${SMTP_URL:-}${RESEND_API_KEY:-}
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        call() { echo "wget -q -O /dev/null --header 'Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/$$1"; }
        {
          echo "30 6,17,22 * * * $$(call market-prices)"
          echo "50 6,17,23 * * * $$(call net-worth-snapshot)"
          echo "30 3 * * * $$(call account-deletion)"
          # Summary and alert emails only with an email service.
          if [ -n "$$EMAIL_CONFIGURED" ] && [ "$$NOTIFICATIONS_MODE" = "execute" ]; then
            echo "30 7 * * * $$(call notifications)"
          fi
          # Bank jobs run only if GoCardless is configured (without credentials they would return 500).
          if [ -n "$$GOCARDLESS_SECRET_ID" ] && [ -n "$$GOCARDLESS_SECRET_KEY" ]; then
            echo "0 */12 * * * $$(call gocardless-sync)"
            echo "15 4 * * * $$(call gocardless-maintenance)"
          fi
        } > /etc/crontabs/root
        exec crond -f -l 8

  # AI import of any bank or broker CSV (the parser is written by a model through OpenRouter). Off by default:
  # set OPENROUTER_API_KEY and OPENROUTER_MODEL, then COMPOSE_PROFILES=ai in .env (or `docker compose --profile ai up -d`).
  csv-worker:
    image: ghcr.io/yonderurik/buddy-budget-csv-worker:${BUDDYBUDGET_VERSION:-latest}
    profiles: ["ai"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
