# BuddyBudget in self-hosting: app + Postgres + Redis + promemoria dei lavori periodici.
# Guida completa: docs/self-hosting.md. Avvio rapido: ./scripts/selfhost-init.sh && docker compose up -d
#
# Le immagini vengono da ghcr.io (BUDDYBUDGET_VERSION, default latest). Per costruirle dal sorgente:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

name: buddybudget

x-app-env: &app-env
  NODE_ENV: production
  # sslmode=disable: il Postgres del compose è nella rete interna e non ha certificati. Un Postgres esterno
  # va invece raggiunto con sslmode=require (vedi docs/self-hosting.md).
  DATABASE_URL: postgresql://buddybudget:${POSTGRES_PASSWORD:?Manca POSTGRES_PASSWORD, lancia ./scripts/selfhost-init.sh}@postgres:5432/buddybudget?sslmode=disable
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Manca BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
  APP_URL: ${APP_URL:-http://localhost:3000}
  CRON_SECRET: ${CRON_SECRET:?Manca CRON_SECRET}
  # Integrazioni facoltative: vuote = spente (vedi .env.selfhost.example).
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
  GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buddybudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Manca POSTGRES_PASSWORD}
      POSTGRES_DB: buddybudget
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddybudget -d buddybudget"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Solo cache, rate limiting e stato dei job in background: si può perdere senza danni, niente volume.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Applica le migration e termina. Gira a ogni `up`, quindi un aggiornamento le porta avanti da solo.
  migrate:
    image: ghcr.io/yonderurik/buddy-budget-migrate:${BUDDYBUDGET_VERSION:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://buddybudget:${POSTGRES_PASSWORD:?Manca POSTGRES_PASSWORD}@postgres:5432/buddybudget?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ghcr.io/yonderurik/buddy-budget:${BUDDYBUDGET_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    # Di default solo da questa macchina: per metterla online usa un reverse proxy HTTPS (docs/self-hosting.md).
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Chiama gli endpoint /api/cron/* agli stessi orari (UTC) del cluster di produzione: prezzi di mercato,
  # snapshot del patrimonio, sync bancario, eliminazione account. Senza questo, prezzi e storico non si aggiornano.
  cron:
    image: alpine:3.21
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Manca CRON_SECRET}
      GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        call() { echo "wget -q -O /dev/null --header 'Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/$$1"; }
        {
          echo "30 6,17,22 * * * $$(call market-prices)"
          echo "50 6,17,23 * * * $$(call net-worth-snapshot)"
          echo "30 3 * * * $$(call account-deletion)"
          # I lavori bancari partono solo se GoCardless è configurato (senza credenziali risponderebbero 500).
          if [ -n "$$GOCARDLESS_SECRET_ID" ]; then
            echo "0 */12 * * * $$(call gocardless-sync)"
            echo "15 4 * * * $$(call gocardless-maintenance)"
          fi
        } > /etc/crontabs/root
        exec crond -f -l 8

volumes:
  postgres-data:
