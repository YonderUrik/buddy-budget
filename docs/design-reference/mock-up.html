document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

const cfSaveP = this.buildPath(cfSave);\n\n    // ---- investimenti: viste per tipologia / geografia / settore ----\n    const typeOf = (h) => {\n      if(/bond|aggh|obblig/i.test(h.ticker+' '+h.name)) return 'Obbligazioni';\n      if(/etf|vanguard|ishares|amundi|xtrackers|lyxor|msci|ftse/i.test(h.name)) return 'ETF azionari';\n      return 'Azioni singole';\n    };\n    const typeMap = {};\n    this.state.holdings.forEach(h => {\n      let dq = 0;\n      invTxsArr.forEach(t => { if(t.hid===h.id) dq += (t.type==='buy' ? t.qty : -t.qty); });\n      typeMap[typeOf(h)] = (typeMap[typeOf(h)]||0) + (h.qty+dq)*h.price;\n    });\n    const typeEntries = Object.entries(typeMap).sort((a,b)=>b[1]-a[1]);\n    const typeMax = typeEntries.length ? typeEntries[0][1] : 1;\n    const invType = typeEntries.map(([label,v]) => ({\n      label, amount:this.fmt(v),\n      pct: invVal ? (v/invVal*100).toFixed(1).replace('.',',')+'%' : '—',\n      barStyle: this.bar(Math.max(3, v/typeMax*100)+'%')\n    }));\n    const mkDist = (rows) => {\n      const mx = rows[0][1];\n      return rows.map(([label,p]) => ({ label, pct:String(p).replace('.',',')+'%', barStyle:this.bar(Math.max(3, p/mx*100)+'%') }));\n    };\n    const invGeo = mkDist([['Stati Uniti',58.4],['Europa',16.2],['Giappone',6.1],['Mercati emergenti',9.8],['Altro',9.5]]);\n    const invSector = mkDist([['Tecnologia',27.3],['Finanza',15.8],['Salute',11.2],['Beni di consumo',10.6],['Industria',10.1],['Altro',25]]);\n\n    // ---- spese period filter ----\n    const sp = this.speseData[speseRange];\n    const speseFilters = [['week','Settimana'],['month','Mese'],['quarter','3 mesi'],['year','Anno']];\n\n    // ---- debiti: un piano per ogni debito ----\n    const debtsArr = this.state.debts;\n    let debtTotal = 0, debtPaySum = 0, debtInt = 0;\n    const debtCards = debtsArr.map(d => {\n      const r = d.rate/100;\n      const valid = d.payment > d.balance*r/12 + 0.01;\n      const base = valid ? this.loanPlan(d.balance, r, d.payment) : { n:0, interest:0, series:[d.balance, d.balance] };\n      const fast = valid ? this.loanPlan(d.balance, r, d.payment + d.extra) : base;\n      debtTotal += d.balance; debtPaySum += d.payment; debtInt += base.interest;\n      const fastPad = fast.series.slice();\n      while(fastPad.length < base.series.length) fastPad.push(0);\n      const lstep = Math.max(1, Math.round(base.series.length/40));\n      const samp = (arr) => { const o=[]; for(let i=0;i<arr.length;i+=lstep) o.push(arr[i]); if(o[o.length-1]!==arr[arr.length-1]) o.push(arr[arr.length-1]); return o; };\n      const bp = this.buildPath(samp(base.series), 0, d.balance||1);\n      const fp = this.buildPath(samp(fastPad), 0, d.balance||1);\n      return {\n        id: d.id, letter: d.letter, sub: d.sub,\n        nameValue: d.name, onName: (e)=>this.updDebtName(d.id, e.target.value),\n        balValue: d.balance.toLocaleString('it-IT'), onBal: (e)=>this.updDebt(d.id,'balance',e.target.value),\n        rateValue: String(d.rate).replace('.',','), onRate: (e)=>this.updDebt(d.id,'rate',e.target.value),\n        payValue: d.payment.toLocaleString('it-IT'), onPay: (e)=>this.updDebt(d.id,'payment',e.target.value),\n        extra: d.extra, onExtra: (e)=>this.setState({ debts: this.updList('debts', d.id, { extra: parseInt(e.target.value,10) }) }),\n        endBase: valid ? String(2026 + Math.floor(base.n/12)) : '—',\n        endFast: valid ? String(2026 + Math.floor(fast.n/12)) : '—',\n        savedTime: valid ? this.savedTimeText(base.n - fast.n) : 'la rata non copre gli interessi',\n        savedInterest: this.fmt(base.interest - fast.interest),\n        baseLine: bp.line, fastLine: fp.line, fastArea: fp.area,\n        onRemove: ()=>this.removeDebt(d.id)\n      };\n    });\n    const bigDebt = debtsArr.slice().sort((a,b)=>b.balance-a.balance)[0];\n    let amortName = '—', amortRows = [];\n    if(bigDebt && bigDebt.payment > bigDebt.balance*bigDebt.rate/1200){\n      amortName = bigDebt.name;\n      let ab = bigDebt.balance;\n      amortRows = ['lug','ago','set','ott','nov'].map(mm => {\n        const ii = ab*bigDebt.rate/1200; const cc = Math.min(bigDebt.payment-ii, ab); ab -= cc;\n        return { m: mm+' 2026', int: this.fmt2(ii), cap: this.fmt2(cc), res: this.fmt(ab) };\n      });\n    }\n    const nd = this.state.newDebt;\n\n    // ---- pianifica: simulatore what-if ----\n    const { horizon, scWork, scHouse, scChild, workAmt, workYear, houseCost, houseMonthly, houseYear, childCost, childYear, retPct, baseSave } = this.state;\n    const scen = this.project(horizon, true);\n    const basePr = this.project(horizon, false);\n    const pmn = Math.min(...basePr.series, ...scen.series), pmx = Math.max(...basePr.series, ...scen.series);\n    const planP = this.buildPath(scen.series, pmn, pmx);\n    const planBaseP = this.buildPath(basePr.series, pmn, pmx);\n    const anyScen = scWork || scHouse || scChild;\n    const delta = scen.final - basePr.final;\n\n    return {\n      rootRef: this.rootRef,\n      themeIcon: this.state.theme==='light' ? '☾' : '☀',\n      toggleTheme: () => this.setState(s => ({ theme: s.theme==='light'?'dark':'light' })),\n      title: m.title, subtitle: screen==='spese' ? sp.subtitle : m.subtitle,\n      isOverview: screen==='overview', isConti: screen==='conti', isSpese: screen==='spese', isInvest: screen==='invest', isPensione: screen==='pensione', isAnalytics: screen==='analytics',\n      isCashflow: screen==='cashflow', isDebiti: screen==='debiti', isPianifica: screen==='pianifica',\n      navItems: this.navList.map(([k,label]) => ({ key:k, label, onClick:()=>this.setState({screen:k}), style: k===screen ? this.navStyleActive : this.navStyle })),\n      periodItems: ['1M','3M','1A','Max'].map(k => ({ key:k, onClick:()=>this.setState({period:k}), style: k===period ? this.pStyleActive : this.pStyle })),\n      periodLabel: labels[period],\n      areaPath: chart.area, linePath: chart.line,\n      pensionArea: penPaths.area, pensionLine: penPaths.line,\n      movements: this.movements.map(m => ({ ...m, icon: this.icn(m.icon) })), allocation,\n      holdings: holdingItems, invType, invGeo, invSector,\n      savingsTrend: this.savingsTrend, lifestyleBars: this.lifestyleBars, subs: this.subs,\n      // live totals\n      netWorthStr: this.fmt(netWorth), liquidTotalStr: this.fmt(liquidTotal), liquidNonDepStr: this.fmt(liquidNonDep),\n      accountItems, addAccount: () => this.addAccount(), accountCount: String(accounts.length),\n      badgeAutoStyle: this.badgeAuto, badgeManualStyle: this.badgeManual,\n      // spese\n      speseFilterItems: speseFilters.map(([k,lbl]) => ({ key:lbl, onClick:()=>this.setState({speseRange:k}), style: k===speseRange ? this.pStyleActive : this.pStyle })),\n      spKpiTitle: sp.kpiTitle, spTotal: sp.total, spBudget: sp.budget, spRem: sp.rem, spRemNote: sp.remNote, spAvg: sp.avg, spAvgNote: sp.avgNote,\n      speseCats: sp.cats.map(c => ({ ...c, icon: this.catIcon(c.label) })), spFixed: sp.fixed, spVar: sp.variable, spFixedBar: sp.fixedBar, spVarBar: sp.varBar,\n      spTrend: sp.trend, spTrendTitle: sp.trendTitle, spTrendAvg: sp.trendAvg,\n      // cash flow\n      cfMonths: this.cfMonths, incomeSources: this.incomeSources, cfAlloc: this.cfAlloc,\n      // investimenti\n      invTotalStr: this.fmt(invVal),\n      invGainStr: this.fmtSigned(invGain),\n      invGainPctStr: invCost ? this.fmtPct(invGain/invCost*100) + ' sul capitale investito' : '—',\n      invCostStr: this.fmt(invCost),\n      nhTicker: nh.ticker, onNhTicker: this.setNewHold('ticker'),\n      nhName: nh.name, onNhName: this.setNewHold('name'),\n      nhQty: nh.qty, onNhQty: this.setNewHold('qty'),\n      nhPrice: nh.price, onNhPrice: this.setNewHold('price'),\n      addHolding: ()=>this.addHolding(),\n      // investimenti: transazioni\n      invTxItems,\n      holdOptions: this.state.holdings.map(h => ({ id:h.id, label: h.ticker + ' · ' + h.name })),\n      ntxHid: ntx.hid, onNtxHid: this.setNewTx('hid'),\n      ntxQty: ntx.qty, onNtxQty: this.setNewTx('qty'),\n      ntxPrice: ntx.price, onNtxPrice: this.setNewTx('price'),\n      ntxDate: ntx.date, onNtxDate: this.setNewTx('date'),\n      onNtxBuy: ()=>this.setState(s => ({ newTx: { ...s.newTx, type:'buy' } })),\n      onNtxSell: ()=>this.setState(s => ({ newTx: { ...s.newTx, type:'sell' } })),\n      ntxBuyStyle: segBtn(ntx.type==='buy'), ntxSellStyle: segBtn(ntx.type==='sell'),\n      ntxTotalStr: ntxTotal>0 ? this.fmt2(ntxTotal) : '—',\n      addInvTx: ()=>this.addInvTx(),\n      // spese: transazioni\n      spTxItems,\n      spTxTotStr: this.fmt2(spTot), spTxExclStr: this.fmt2(spExcl), spTxEffStr: this.fmt2(spTot - spExcl),\n      catOptions: this.catOptionsList.map(label => ({ label })),\n      nspDesc: nsp.desc, onNspDesc: this.setNewSpTx('desc'),\n      nspCat: nsp.cat, onNspCat: this.setNewSpTx('cat'),\n      nspAmount: nsp.amount, onNspAmount: this.setNewSpTx('amount'),\n      nspDate: nsp.date, onNspDate: this.setNewSpTx('date'),\n      addSpTx: ()=>this.addSpTx(),\n      // pensione\n      penContrib, penContribStr: penContrib.toLocaleString('it-IT'),\n      penRet, penRetStr: String(penRet).replace('.',','), penAge,\n      onPenContrib: this.onNum('penContrib'), onPenRet: this.onNum('penRet'), onPenAge: this.onNum('penAge'),\n      penFinalStr: '≈ ' + this.fmt(Math.round(pv/1000)*1000),\n      penNowStr: this.fmt(penNow), penNowValue: penNow.toLocaleString('it-IT'),\n      onPenNow: (e)=>this.setState({ penNow: this.parseNum(e.target.value) }),\n      penPaidValue: penPaid.toLocaleString('it-IT'),\n      onPenPaid: (e)=>this.setState({ penPaid: this.parseNum(e.target.value) }),\n      penPaidStr: this.fmt(penPaid),\n      penGrowthStr: this.fmtSigned(penGrowth), penGrowthPlainStr: this.fmt(penGrowth),\n      penGrowthPctStr: penPaid>0 ? this.fmtPct(penGrowth/penPaid*100) : '—',\n      penBarPaid: { width:penPaidPct+'%', background:'var(--seg1)' },\n      penBarGrowth: { width:(100-penPaidPct)+'%', background:'var(--seg3)' },\n      // cash flow risparmio\n      cfSaveLine: cfSaveP.line, cfSaveArea: cfSaveP.area,\n      // debiti\n      debtCards,\n      debtTotalStr: this.fmt(debtTotal),\n      debtTotalNegStr: '−' + this.fmt(debtTotal),\n      realWealthStr: this.fmt(187430 + 265000 - debtTotal),\n      debtPayStr: this.fmt(debtPaySum),\n      debtPayPctStr: 'il ' + Math.round(debtPaySum/3740*100) + '% delle tue entrate',\n      debtInterestStr: this.fmt(debtInt),\n      debtCountStr: debtsArr.length === 1 ? '1 debito attivo' : debtsArr.length + ' debiti attivi',\n      amortName, amortRows,\n      ndName: nd.name, onNdName: this.setNewDebt('name'),\n      ndBalance: nd.balance, onNdBalance: this.setNewDebt('balance'),\n      ndRate: nd.rate, onNdRate: this.setNewDebt('rate'),\n      ndPayment: nd.payment, onNdPayment: this.setNewDebt('payment'),\n      addDebt: ()=>this.addDebt(),\n      // pianifica\n      horizon, horizonYear: String(2026 + horizon), onHorizon: this.onNum('horizon'),\n      scWorkOn: scWork, scHouseOn: scHouse, scChildOn: scChild,\n      toggleWork: this.tog('scWork'), toggleHouse: this.tog('scHouse'), toggleChild: this.tog('scChild'),\n      scWorkBox: this.scBox(scWork), scHouseBox: this.scBox(scHouse), scChildBox: this.scBox(scChild),\n      scBtnStyle: this.scBtn,\n      scWorkTrack: this.swTrack(scWork), scWorkKnob: this.swKnob(scWork),\n      scHouseTrack: this.swTrack(scHouse), scHouseKnob: this.swKnob(scHouse),\n      scChildTrack: this.swTrack(scChild), scChildKnob: this.swKnob(scChild),\n      workAmt, onWorkAmt: this.onNum('workAmt'), workYear, onWorkYear: this.onNum('workYear'),\n      houseCost, onHouseCost: this.onNum('houseCost'), houseCostStr: this.fmt(houseCost), houseCostNegStr: '−' + this.fmt(houseCost),\n      houseMonthly, onHouseMonthly: this.onNum('houseMonthly'), houseMonthlyStr: this.fmtSigned(houseMonthly),\n      houseYear, onHouseYear: this.onNum('houseYear'),\n      childCost, onChildCost: this.onNum('childCost'), childYear, onChildYear: this.onNum('childYear'),\n      retPct, onRetPct: this.onNum('retPct'), retPctStr: String(retPct).replace('.',','),\n      baseSave, onBaseSave: this.onNum('baseSave'),\n      planLine: planP.line, planArea: planP.area, planBaseLine: planBaseP.line,\n      scenFinalStr: this.fmt(scen.final), baseFinalStr: this.fmt(basePr.final),\n      deltaStr: anyScen ? this.fmtSigned(delta) + ' vs ritmo attuale' : 'attiva uno scenario per confrontare'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
