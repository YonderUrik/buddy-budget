# Serve `out/` (export statico). Porta 3000 perché la NetworkPolicy del namespace `app` apre solo quella a Traefik.
# Traduce public/_headers e public/_redirects di Cloudflare Pages: tenerli allineati se cambiano.
# Markdown per gli agenti: `scripts/generate-markdown.mjs` scrive un .md accanto a ogni pagina HTML e la mappa dei token
# ($md_target e $markdown_tokens, in /etc/nginx/conf.d/markdown-tokens.conf, copiato dal Dockerfile). Con `Accept: text/markdown` si serve il .md, altrimenti l'HTML.
# L'header è una lista con q-values: si serve il Markdown solo se è nominato esplicitamente (un `*/*` non basta) e non ha q=0.
map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown(?!\s*;\s*q=0(?:\.0*)?(?:,|$))" 1;
}

# Country of the visitor for the landing (`lib/visitor-country.ts`): Cloudflare sends `CF-IPCountry` (ISO alpha-2, `XX`
# unknown, `T1` Tor). HTML responses carry it back as the `bb-country` cookie, which the boot script reads before the
# first paint (language to land on, blocks built on Italian rules). Never for crawlers, previews and audits: they must
# always see the full Italian page, or Google would index Italian addresses as redirects to English.
map $http_user_agent $is_crawler {
    default 0;
    "" 1;
    "~*(bot|crawl|spider|slurp|google|bing|yandex|baidu|duckduck|facebookexternalhit|meta-external|embedly|preview|lighthouse|pagespeed|headless|phantomjs|puppeteer|playwright|selenium|whatsapp|vkshare|uptime|monitor|pingdom|statuscake|validator|curl|wget|python|httpclient|okhttp|go-http|java/|libwww|axios|node-fetch|scrapy)" 1;
}
# Pages only: `location /` also serves images and icons from `public/`, and a Set-Cookie there would keep Cloudflare
# from caching them. A path without an extension or ending in .html is a page.
map $uri $is_page {
    default 0;
    "~^[^.]*$" 1;
    "~\.html$" 1;
}
# The whole cookie, or empty: `add_header` skips a header whose value is empty, so no broken `Set-Cookie` is sent.
map "$is_crawler:$is_page:$http_cf_ipcountry" $country_cookie {
    default "";
    "0:1:XX" "";
    "~^0:1:(?<visitor_country>[A-Z]{2})$" "bb-country=$visitor_country; Path=/; Max-Age=86400; SameSite=Lax; Secure";
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dietro Traefik la porta interna (3000) non deve finire negli URL dei redirect.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # `add_header` a livello server vale solo nelle location che non ne definiscono di proprie:
    # per questo la location degli asset ripete gli stessi header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vecchi indirizzi dell'app (segnalibri, magic link già inviati): ora vivono su app.buddybudget.io.
    # 302 all'inizio, dopo ~2 settimane passarli a 308 (come in _redirects).
    location ~ ^/(?:login|onboarding|panoramica|conti|movimenti|investimenti|debiti|categorizza|impostazioni|account-disattivato|api)(?:/|$) {
        return 302 https://app.buddybudget.io$request_uri;
    }
    location ~ ^/(?:spese|transazioni)(?<rest_movimenti>/.*)?$ {
        return 302 https://app.buddybudget.io/movimenti$rest_movimenti$is_args$args;
    }
    location ~ ^/cash-flow(?<rest_analisi>/.*)?$ {
        return 302 https://app.buddybudget.io/movimenti/analisi$rest_analisi$is_args$args;
    }
    location ~ ^/categorie(?<rest_categorie>/.*)?$ {
        return 302 https://app.buddybudget.io/movimenti/categorie$rest_categorie$is_args$args;
    }

    # Sorgenti dei redirect/header di Pages copiate in out/: non vanno esposte.
    location ~ ^/_(?:headers|redirects|markdown-tokens\.conf)$ {
        return 404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # HTML pages change with Accept: Vary tells caches and CDNs (Cloudflare included). The country cookie goes only
    # here (HTML), never on assets or Markdown.
    location / {
        add_header Vary "Accept" always;
        add_header Set-Cookie $country_cookie always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        if ($md_target) {
            rewrite ^ $md_target last;
        }
        try_files $uri $uri.html $uri/index.html =404;
    }

    # URL canonici senza slash finale: /funzioni/ -> /funzioni (prima: 403, o redirect verso :3000 per /guide).
    location ~ ^/(?<noslash>.+)/$ {
        return 301 /$noslash$is_args$args;
    }

    # Destinazione dei rewrite qui sopra: solo le pagine, mai richiesta diretta sensata ma innocua.
    location ~ \.md$ {
        default_type "text/markdown";
        charset utf-8;
        charset_types text/markdown;
        add_header Vary "Accept" always;
        add_header x-markdown-tokens $markdown_tokens always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
}
