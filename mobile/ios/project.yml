# Generate the Xcode project with `xcodegen` (the .xcodeproj is not committed).
name: BuddyBudget
options:
  bundleIdPrefix: io.buddybudget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Source language of the string catalog (spec strings are keyed by Italian source text).
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  BuddyBudgetKit:
    path: BuddyBudgetKit
targets:
  BuddyBudget:
    type: application
    platform: iOS
    sources: [BuddyBudget]
    dependencies:
      - package: BuddyBudgetKit
    info:
      path: BuddyBudget/Resources/Info.plist
      properties:
        CFBundleDisplayName: BuddyBudget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [it, en, de]
        # Bundled fonts (spec: design/tokens.md §2.1), copied by spec/scripts/gen-tokens.mjs.
        UIAppFonts:
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - SofiaSansExtraCondensed-Light.ttf
          - SofiaSansExtraCondensed-Regular.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Bank consent return (R6): buddybudget://bank/return, captured by ASWebAuthenticationSession.
        CFBundleURLTypes:
          - CFBundleURLName: io.buddybudget.app.bank-return
            CFBundleURLSchemes: [buddybudget]
        # Imports (14-imports, 07-investments): CSV / Excel files shared from other apps («Apri in BuddyBudget»).
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text, public.tab-separated-values-text]
          - CFBundleTypeName: Excel
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.spreadsheetml.sheet, com.microsoft.excel.xls]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.buddybudget.app
        GENERATE_INFOPLIST_FILE: NO
        # Icons.xcassets holds only the Lucide icons (spec/scripts/gen-icons.mjs); no app icon set yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: 
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.buddybudget.app.debug
          API_BASE_URL: http://localhost:3001/
        Release:
          API_BASE_URL: https://buddybudget.io/
schemes:
  BuddyBudget:
    build:
      targets:
        BuddyBudget: all
    test:
      targets: []
