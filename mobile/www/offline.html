<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BuddyBudget</title>
    <style>
      /* Literal values: this page is bundled in the app and cannot load globals.css. Keep in line with --background/--foreground/--primary. */
      :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #111113; --muted: #6b6b76; --primary: #1f2a44; --on-primary: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f4f4f5; --muted: #a1a1aa; --primary: #e4e7ee; --on-primary: #111113; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: -apple-system, system-ui, sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.375rem; margin: 0 0 .5rem; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: .75rem; padding: .875rem 1.5rem; width: 100%;
        background: var(--primary); color: var(--on-primary); }
    </style>
  </head>
  <body>
    <main>
      <h1>Nessuna connessione</h1>
      <p>BuddyBudget ha bisogno di internet per mostrarti i tuoi conti. Controlla la rete e riprova.</p>
      <button type="button" onclick="location.href = window.Capacitor?.getServerUrl?.() ?? 'https://app.buddybudget.io'">Riprova</button>
    </main>
  </body>
</html>
